name: No Spark References

on:
  push:
  pull_request:

jobs:
  check-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if "spark" appears in the repo
        run: |
          if git grep -InE 'spark' -- \
              ':!bun.lock' \
              ':!package-lock.json' \
              ':!yarn.lock' \
              ':!pnpm-lock.yaml' \
              ':!node_modules' \
              ':!dist' \
              ':!.github/workflows/no-spark.yml'; then
            echo "::error::Found forbidden 'spark' reference. The brand is AREELIVE."
            exit 1
          fi
          echo "No 'spark' references found."